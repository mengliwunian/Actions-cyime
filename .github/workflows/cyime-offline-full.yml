# CyIME 离线全内置自动构建
# 用法：把本文件放到你自己的 GitHub 仓库 .github/workflows/cyime-offline-full.yml
# 每次定时/手动运行：拉取 Cyletix/CyIME 最新 main -> 改造 -> 编译 -> 发布到你自己的 Release。
name: CyIME Offline Full Auto Build

on:
  #schedule:
    # UTC 17:17 = 北京时间次日 01:17，错开整点避免排队丢弃
    #- cron: '17 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyime-offline-full
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # GitHub 不允许在 if: 中直接引用 secrets.*，先在 job 级 env 映射
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout CyIME main (with submodules)
        uses: actions/checkout@v4
        with:
          repository: Cyletix/CyIME
          ref: main
          path: cyime-src
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: cyime-src/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache ONNX runtime
        uses: actions/cache@v4
        with:
          path: |
            cyime-src/app/src/main/jni/onnxruntime
            cyime-src/app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('cyime-src/app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: native-${{ runner.os }}-

      - name: Cache CMake native build
        uses: actions/cache@v4
        with:
          path: |
            cyime-src/app/.cxx
            cyime-src/app/src/main/jni/boost
            cyime-src/app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('cyime-src/app/src/main/jni/CMakeLists.txt') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Warm up native deps
        working-directory: cyime-src
        run: ./gradlew downloadOnnx --no-daemon

      # ------------------------------------------------------------------
      # 源码改造（全部内嵌，单文件即可用）
      # ------------------------------------------------------------------
      - name: Patch source for offline-full build
        working-directory: cyime-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          ROOT = Path('.').resolve()
          TRANSLATE_IDS = ('translate-zh-en', 'translate-en-zh')
          NETWORK_PERMISSIONS = (
              'INTERNET',
              'ACCESS_WIFI_STATE',
              'ACCESS_NETWORK_STATE',
              'REQUEST_INSTALL_PACKAGES',
          )

          def fail(msg):
              print(f'::error::{msg}', flush=True)
              sys.exit(1)

          def patch(path, fn, label, allow_noop=False):
              p = ROOT / path
              if not p.is_file():
                  fail(f'missing file: {path}')
              text = p.read_text(encoding='utf-8')
              new = fn(text)
              if new == text:
                  if allow_noop:
                      print(f'already patched, skipped: {label} ({path})', flush=True)
                      return
                  fail(f'patch produced no change: {label} ({path})')
              p.write_text(new, encoding='utf-8')
              print(f'patched: {label} -> {path}', flush=True)

          # 1) 把双向翻译模型加入内置白名单。
          #    prepare-bundled-models.py 会从 BuiltinModelCatalog.kt
          #    读取这两个模型的 URL/SHA-256 并下载、写入 manifest.json。
          def add_translate_to_included(text):
              m = re.search(r'(INCLUDED\s*=\s*\{)(.*?)(\})', text, re.S)
              if not m:
                  fail('cannot find INCLUDED set in scripts/prepare-bundled-models.py')
              ids = set(re.findall(r"['\"]([^'\"]+)['\"]", m.group(2)))
              ids.update(TRANSLATE_IDS)
              replacement = ', '.join(f"'{i}'" for i in sorted(ids))
              return text[:m.start(2)] + replacement + text[m.end(2):]

          patch('scripts/prepare-bundled-models.py', add_translate_to_included,
                'bundle translate-zh-en / translate-en-zh', allow_noop=True)

          # 1b) prepare-bundled-models.py 用正则解析 ModelFile(...)，只认字面量 URL。
          #     翻译模型的 URL 写成 RELEASE + "..." 拼接，原脚本解析不到（files=0），
          #     会在 prepareBundledModels 阶段抛 Unsupported/incomplete pinned catalog。
          #     这里在解析前把 `RELEASE + "..."` 展开为拼接后的字面字符串。
          def expand_release_concat(text):
              old = "        source = (ROOT / 'app/src/main/java/com/kingzcheung/xime' / name).read_text(encoding='utf-8')"
              if old not in text:
                  fail('prepare script source-loading line changed upstream; review manually')
              insertion = (
                  old
                  + "\n        # offline-full patch: expand `RELEASE + \"...\"` so the ModelFile regex can parse it"
                  + "\n        source = re.sub(r'RELEASE\\s*\\+\\s*\"([^\"]+)\"', lambda m: '\"' + m.group(1) + '\"', source)"
              )
              if 'offline-full patch: expand' in text:
                  return text
              return text.replace(old, insertion, 1)

          patch('scripts/prepare-bundled-models.py', expand_release_concat,
                'expand RELEASE + literal in model catalog parsing', allow_noop=True)

          # 2) 安装器也有自己的白名单，必须同步，否则启动时的
          #    check(bundled.all { it in modelIds }) 会失败。
          def add_translate_to_installer(text):
              m = re.search(r'(val modelIds\s*=\s*setOf\()([^)]*)(\))', text, re.S)
              if not m:
                  fail('cannot find modelIds in BundledModelInstaller.kt')
              inner = m.group(2).rstrip()
              if 'translate-zh-en' in inner:
                  return text
              if not inner.endswith(','):
                  inner += ','
              inner += '\n        "translate-zh-en", "translate-en-zh",'
              return text[:m.start(2)] + inner + text[m.end(2):]

          patch('app/src/main/java/com/kingzcheung/xime/model/BundledModelInstaller.kt',
                add_translate_to_installer, 'installer modelIds', allow_noop=True)

          # 3) 去联网：只改 Manifest 声明，不删除任何源码模块。
          #    App 代码保留但拿不到 INTERNET 权限，因此无法联网。
          def strip_network_permissions(text):
              for perm in NETWORK_PERMISSIONS:
                  pattern = (
                      r'^[ \t]*<uses-permission[^>]*android:name="android\.permission\.'
                      + re.escape(perm) + r'"[^>]*\/>[ \t]*\r?\n?'
                  )
                  text, n = re.subn(pattern, '', text, flags=re.M)
                  if n > 1:
                      fail(f'expected at most 1 {perm} permission declaration, found {n}')
                  if n == 0:
                      print(f'permission already absent: {perm}', flush=True)
              if 'android.permission.INTERNET' in text:
                  fail('INTERNET still present in AndroidManifest.xml')
              return text

          patch('app/src/main/AndroidManifest.xml', strip_network_permissions,
                'remove INTERNET / WIFI / NETWORK_STATE / INSTALL_PACKAGES')

          # 4) 合规文案：翻译模型从“按需下载”改为“内置”。
          def notice_bundled(text):
              old = 'Models (downloaded on request, not bundled): Firefox Translations zh-en and en-zh'
              if old in text:
                  return text.replace(
                      old,
                      'Models (BUNDLED in this offline-full build): Firefox Translations zh-en and en-zh',
                      1,
                  )
              if 'Models (BUNDLED in this offline-full build)' in text:
                  return text
              fail('NOTICE.txt translation model wording changed upstream; review manually')

          patch('app/src/main/assets/NOTICE.txt', notice_bundled,
                'NOTICE.txt: translation models marked bundled', allow_noop=True)

          print('All patches applied successfully.', flush=True)
          PY

          cd "$GITHUB_WORKSPACE/cyime-src"
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "BUILD_DASH=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git diff --stat

      - name: Build offline-full Release APKs
        working-directory: cyime-src
        run: |
          ./gradlew assembleRelease \
            -PbundleModels=true \
            -PpythonExecutable=python3 \
            -PversionCode="${BUILD_DATE}" \
            -PversionName="offline-${BUILD_DATE}-${SHORT_SHA}" \
            --no-daemon

      - name: Sign APKs (only when signing secrets are configured)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: cyime-src/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.SIGNING_KEY }}
          alias: ${{ env.ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Prepare release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR="cyime-src/app/build/outputs/apk/release"

          mapfile -t ALL < <(find "$DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          SIGNED=()
          for f in "${ALL[@]}"; do
            case "$f" in *-signed.apk) SIGNED+=("$f");; esac
          done
          if ((${#SIGNED[@]} > 0)); then
            APKS=("${SIGNED[@]}")
            echo "Using signed APKs (${#APKS[@]})"
          else
            APKS=("${ALL[@]}")
            echo "No signing secrets configured; publishing unsigned APKs (${#APKS[@]})"
          fi
          if ((${#APKS[@]} == 0)); then
            echo "::error::No APK found in $DIR"
            exit 1
          fi

          cp cyime-src/LICENSE ./LICENSE
          cp cyime-src/app/src/main/assets/NOTICE.txt ./NOTICE.txt

          TAG="cyime-offline-${BUILD_DATE}-${SHORT_SHA}"
          # 源码 checkout 在 cyime-src 子目录，workspace 根目录不是 git 仓库，
          # 必须显式指定 --repo，否则 gh 无法确定发布到哪个仓库。
          REPO="${GITHUB_REPOSITORY}"
          # 同一天同一提交重复手动触发时，先删旧 Release，保证幂等
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true

          cat > RELEASE_NOTES.md <<EOF
          ## CyIME offline-full（自动构建）

          - 基于上游 \`Cyletix/CyIME\` main 分支提交 \`${SHORT_SHA}\`
          - 内置：离线语音、拍照识别（OCR）、离线翻译中译英 / 英译中
          - 已移除 Manifest 中的 INTERNET / ACCESS_WIFI_STATE / ACCESS_NETWORK_STATE / REQUEST_INSTALL_PACKAGES 声明
          - 模型许可：Firefox Translations（MPL-2.0）、PP-OCRv5 / OpenCV（Apache-2.0）、SenseVoice（FunASR 许可）
          - 项目许可：GPL-3.0；改造源码仓库需按 GPL-3.0 公开并保留上游版权声明
          - 构建时间：${BUILD_DASH}
          EOF

          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "NOTE: APKs are unsigned; sign locally before installing." >> RELEASE_NOTES.md
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "CyIME offline-full ${BUILD_DASH} (${SHORT_SHA})" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            "${APKS[@]}" LICENSE NOTICE.txt

          echo "Published release: $TAG"
